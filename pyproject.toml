[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-forecasting-regime-shifts"
version = "0.1.0"
description = "Leakage-aware data foundation for walk-forward stock forecasting research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "PyYAML>=6,<7",
    "exchange-calendars>=4,<5",
    "yfinance>=0.2.40,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
lightgbm = [
    "lightgbm>=4,<5",
    "scikit-learn>=1.4,<2",
]
lstm = [
    "torch>=2,<3",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
