scientific_role:
  inclusion_reason: methodological_diversity
  scientific_question: >-
    Does a patch-based, channel-independent temporal encoder provide meaningfully
    different forecasting behavior from zero-return persistence, tabular LightGBM,
    and recurrent LSTM under the same causal feature, target, fold, and evaluation
    contract?
  expected_superiority_claimed: false
  prohibited_rationales:
    - lightgbm_performed_poorly
    - lstm_performed_poorly
    - project_needs_a_model_that_beats_baseline
    - transformer_is_assumed_superior

prediction_task:
  primary_task: regression
  target_column: target_log_return
  target_definition: next_observed_trading_session_asset_local_log_return
  forecast_horizon_observed_sessions: 1
  input_tensor_layout: [batch, context_length, 17]
  output_tensor_layout: [batch]
  output_dtype: float32
  target_scaling: none
  secondary_direction:
    output_column: predicted_direction
    rule: "1 if predicted_log_return > 0 else 0"
    separate_classifier: prohibited

assets:
  target_assets:
    - AAPL
    - MSFT
    - GOOGL
    - NVDA
  market_reference: SPY
  market_reference_is_prediction_target: false
  model_policy: one_separate_model_per_target_asset
  pooled_multi_stock_training: prohibited

features:
  count: 17
  order:
    - asset_log_return_1d
    - asset_log_return_lag_1
    - asset_return_mean_5
    - asset_return_std_5
    - asset_volume_mean_5
    - asset_volume_std_5
    - asset_return_mean_21
    - asset_return_std_21
    - asset_volume_mean_21
    - asset_volume_std_21
    - spy_log_return_1d
    - spy_log_return_lag_1
    - spy_return_mean_5
    - spy_volatility_5
    - spy_return_mean_21
    - spy_volatility_21
    - spy_trend_63
  additional_features_allowed: false
  specifically_prohibited:
    - RSI
    - MACD
    - Bollinger_Bands
    - fundamentals
    - news
    - sentiment
    - macro_data
  regime_labels_are_features: false
  mutate_after_pilot_results: prohibited

model:
  family: patchtst
  documentation_name: PatchTST-style channel-independent patch Transformer
  implementation: small_custom_pytorch
  external_forecasting_framework: none
  defining_properties:
    temporal_patching: true
    channel_independent_patch_encoding: true
    patch_projection_shared_across_channels: true
    transformer_encoder_shared_across_channels: true
    positional_information_across_patch_positions: true
    cross_channel_combination_location: final_scalar_head_only
  conceptual_flow:
    - transpose_time_features_to_feature_channels
    - extract_right_aligned_temporal_patches_per_channel
    - apply_shared_linear_patch_embedding
    - add_learned_patch_position_embedding
    - apply_shared_transformer_encoder_channel_independently
    - restore_batch_channel_patch_embedding_axes
    - flatten_in_channel_patch_embedding_order
    - apply_head_dropout
    - apply_scalar_linear_regression_head
  not_claimed: byte_for_byte_external_library_reproduction

patching:
  alignment: right
  padding: none
  future_information: prohibited
  patch_length: 16
  stride: 8
  final_patch_end_index_formula: context_length_minus_1
  final_patch_start_index_formula: context_length_minus_patch_length
  start_generation: >-
    Begin at context_length - patch_length, repeatedly subtract stride while the
    start is nonnegative, then reverse the starts into chronological order.
  patch_count_formula: "1 + floor((context_length - patch_length) / stride)"
  uncovered_early_context_rows: allowed
  final_patch_must_include_origin_timestep: true
  naive_left_aligned_unfold_that_omits_origin: prohibited

architecture:
  input_channels: 17
  patch_projection:
    type: linear
    in_features: 16
    out_features: 32
    bias: true
    shared_across_channels: true
  positional_embedding:
    type: learned
    shape: [1, number_of_patches, 32]
    initialization: zeros
    shared_across_channels: true
  transformer_encoder:
    d_model: 32
    n_heads: 4
    layers: 2
    feedforward_dimension: 64
    dropout: 0.10
    activation: GELU
    batch_first: true
    norm_first: true
    layer_norm_eps: 0.00001
    final_encoder_layer_norm: true
    weights_shared_across_channels: true
  head:
    pooling: none
    attention_pooling: false
    flatten_order: channel_then_chronological_patch_then_embedding_dimension
    input_dimension_formula: "17 * number_of_patches * 32"
    dropout: 0.10
    output_layer: linear
    output_size: 1
  dtype: float32
  revin: false
  alternate_head_search: false
  architecture_search: false

