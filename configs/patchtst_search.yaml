pilot_acceptance_gate:
  rule: all_P1_through_P7_must_pass
  allowed_statuses: [PASS, FAIL]
  predictive_performance_thresholds: []
  predictive_performance_used_for_acceptance: false
  criteria:
    P1:
      name: Integrity
      pass_if: >-
        Frozen data, historical config, model preregistration, Phase 2G gate,
        Phase 2H-A preregistration, and recorded artifact hashes are unchanged.
    P2:
      name: Complete_grid
      pass_if: >-
        All 16 of 16 candidate-grid fits complete for both contexts, both pilot
        seeds, and all four assets; no required slice is missing.
    P3:
      name: Numerical_validity
      pass_if: >-
        Every loss, prediction, and required metric is finite and no reproducible
        training failure remains.
    P4:
      name: Exact_validation_coverage
      pass_if: >-
        Both contexts and both seeds have exactly the same canonical D1 validation
        keys within every asset, with no intersection or shrinkage.
    P5:
      name: Deterministic_reproducibility
      repeated_configuration: PATCHTST_63
      repeated_asset: AAPL
      repeated_seed: 1729
      prediction_comparison: numpy_allclose
      prediction_rtol: 0.0000001
      prediction_atol: 0.000000001
      metric_comparison: numpy_allclose
      metric_rtol: 0.0000001
      metric_atol: 0.000000001
      exact_fields:
        - canonical_validation_keys
        - best_epoch
        - epochs_run
      pass_if: >-
        The fresh replay reproduces canonical validation keys and discrete training
        outcomes exactly, and predictions plus MAE/RMSE/DA within the frozen tolerances.
    P6:
      name: Resource_feasibility
      pilot_wall_time_cap_seconds: 1800
      measured_scope: >-
        Entire pilot command, including 16 candidate-grid fits, the P5 replay,
        validation, verification, artifact writes, and runner overhead.
      peak_process_memory_bytes: record_where_practical
      memory_measurement_unavailable_policy: document_without_automatic_failure
      pass_if: measured_total_pilot_wall_time_seconds_lte_1800
    P7:
      name: Full_benchmark_feasibility_estimate
      candidate_fits: 120
      refits: 60
      total_fits: 180
      safety_factor: 1.25
      formula: "(pilot_total_seconds / 16) * 180 * 1.25"
      full_runtime_cap_seconds: 21600
      pass_if: estimated_full_seconds_lte_21600

no_performance_gate:
