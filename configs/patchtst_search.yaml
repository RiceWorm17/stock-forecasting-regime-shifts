    fit_rows: training_feature_rows_only
    scaler_shared_across_context_candidates: true
    scaler_shared_across_seeds: true
    each_canonical_feature_row_counted_once: true
    repeated_patch_appearances_counted_in_moments: false
    validation_statistics_allowed: false
    test_statistics_allowed: false
  statistics:
    mean: arithmetic_mean
    variance: population
    ddof: 0
  zero_variance_policy:
    retain_feature: true
    center_feature: true
    effective_scale: 1.0
  future_full_refit:
    allowed_only_after_pilot_and_separate_authorization: true
    fit_rows: train_plus_validation_feature_rows_only
    test_statistics_allowed: false

sequences:
  asset_local: true
  chronological: true
  explicit_keys: [asset, origin_date, target_date]
  context_ends_at_origin_date: true
  target_relation: next_observed_asset_session_after_origin_date
  target_as_input: prohibited
  future_features: prohibited
  padding: none
  require_all_17_features_finite: true
  cross_asset_sequences: prohibited
  validation_context_may_use_prior_training_features: true
  validation_targets_used_for_training_or_preprocessing: false
  candidate_validation_endpoint_keys_must_match: true
  endpoint_key_match_scope: each_asset_across_both_contexts_and_both_pilot_seeds
  intersection_workaround: prohibited

training:
  loss:
    implementation: torch.nn.L1Loss
    reduction: mean
  optimizer:
    implementation: torch.optim.AdamW
    learning_rate: 0.001
    betas: [0.9, 0.999]
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  batch_size: 64
  max_epochs: 40
  shuffle: false
  drop_last: false
  num_workers: 0
  gradient_clip_norm: 1.0
  scheduler: none
  warmup_scheduler: none
  learning_rate_search: false
  early_stopping:
    enabled: true
    monitor: validation_mae_over_individual_rows
    direction: minimize
    min_delta: 0.00001
    improvement_rule: "candidate_validation_mae < tracked_best_validation_mae - min_delta"
    patience_completed_epochs: 6
    restore_best_state: true
    best_epoch_numbering: one_based
    unweighted_mean_of_batch_losses: prohibited
  nonfinite_loss_prediction_or_metric: pilot_failure

determinism:
  reference_device: cpu
  gpu_rescue_if_cpu_gate_fails: prohibited
  deterministic_pytorch_where_supported: true
