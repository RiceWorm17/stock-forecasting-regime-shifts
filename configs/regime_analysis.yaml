label_contract:
  source_assets:
    - SPY
  source_asset_policy: SPY_only
  target_assets:
    - AAPL
    - MSFT
    - GOOGL
    - NVDA
  label_attachment_key: origin_date
  partition_assignment_key: target_date
  prediction_join_keys:
    - fold
    - origin_date
  prediction_join_cardinality: many_prediction_rows_to_one_unique_regime_row
  prediction_join_must_preserve_row_count: true
  prediction_join_must_preserve_prediction_keys: true
  missing_duplicate_or_extra_regime_keys: fail
  intersection_join_to_hide_mismatch: prohibited
  source_population_unit: one_unique_spy_observation_per_origin_date
  duplicate_target_asset_rows_may_weight_thresholds: false
  same_label_for_all_target_assets_models_and_seeds_on_fold_origin_date: true
  asset_specific_regimes: prohibited
  model_specific_regimes: prohibited
  target_date_spy_information: prohibited
  observable_information_cutoff: origin_date_inclusive
  observed_session_calendar: SPY

primary_regime_dimensions:
  count: 3
  order:
    - trend
    - volatility
    - transition
  additional_primary_dimensions_after_results: prohibited
  dimensions_are_overlapping_views: true
  joint_regime_cells_are_primary: false
  prohibited_additions:
    - RSI
    - VIX
    - macro
    - news_or_sentiment
    - sector
    - earnings

regimes:
  trend:
    output_column: trend_regime
    source_quantity: Trend63_t
    equivalent_existing_feature: spy_trend_63
    formula: "log(SPY_close[t] / SPY_close[t-63 observed SPY sessions])"
    fitted_threshold: none
    labels:
      positive_trend: "Trend63_t > 0"
      negative_trend: "Trend63_t <= 0"
    exact_zero_label: negative_trend
    unavailable_history:
      label: unavailable
      exclude_from: trend_regime_analysis_only
      eligible_for_other_dimensions_when_available: true
      imputation: prohibited

  volatility:
    output_column: volatility_regime
    source_quantity: RV21_t
    formula: >-
      population_std(SPY_log_return_1d over 21 observed SPY sessions ending at t,
      ddof=0, min_periods=21) * sqrt(252)
    equivalent_existing_feature: spy_volatility_21
    existing_feature_is_annualized: false
    standard_deviation_ddof: 0
    window_observed_sessions: 21
    minimum_periods: 21
    annualization_factor: sqrt(252)
    annualization_changes_median_classification: false
    threshold:
      statistic: median
      finite_values_only: true
      numeric_definition: average_of_two_middle_order_statistics_when_even
      validation_history_partitions:
        - train
      development_test_history_partitions:
        - train
        - validation
      future_f1_test_history_partitions:
        - train
        - validation
      same_fold_evaluation_partition_in_threshold: prohibited
    labels:
      high_volatility: "RV21_t > fold_threshold"
      low_volatility: "RV21_t <= fold_threshold"
    equality_label: low_volatility
    unavailable_history:
      label: unavailable
      exclude_from: volatility_regime_analysis_only
      eligible_for_other_dimensions_when_available: true
      imputation: prohibited

  transition:
    output_column: transition_regime
    frozen_spec_category_aliases:
      shifted: transition
      stable_normal: stable
    canonical_labels:
      - transition
      - stable
    rv21_jump_ratio:
      formula: "RV21_t / RV21_t_minus_21_observed_spy_sessions"
      lag_observed_sessions: 21
      threshold: 1.5
      transition_predicate: "RV21_jump_ratio_t >= 1.5"
      equality_label: transition
      zero_unavailable_or_nonfinite_denominator:
        ratio_condition: false
        infinity_allowed: false
      unavailable_or_nonfinite_numerator:
        ratio_condition: false
    absolute_return:
      source_quantity: abs_spy_return_t
      formula: "abs(SPY_log_return_1d_t)"
      threshold:
        statistic: quantile
        probability: 0.95
        interpolation: linear
        pandas_equivalent: "pandas.Series.quantile(0.95, interpolation='linear')"
        finite_values_only: true
        validation_history_partitions:
          - train
        development_test_history_partitions:
          - train
          - validation
        future_f1_test_history_partitions:
          - train
          - validation
        same_fold_evaluation_partition_in_threshold: prohibited
      transition_predicate: "abs_spy_return_t > fold_threshold"
      equality_triggers_transition: false
    combination: logical_or
    labels:
      transition: "rv21_jump_ratio_condition OR absolute_return_condition"
      stable: "NOT transition"
    invalid_ratio_does_not_block_independent_absolute_return_condition: true
    if_both_component_inputs_unavailable:
      label: unavailable
      imputation: prohibited

