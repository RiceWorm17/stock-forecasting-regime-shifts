    reference: stable
    mae_skill_degradation: "mae_skill_transition - mae_skill_stable"
  volatility_stress:
    stressed: high_volatility
    reference: low_volatility
    mae_skill_degradation: "mae_skill_high_volatility - mae_skill_low_volatility"
  trend_stress:
    stressed: negative_trend
    reference: positive_trend
    mae_skill_degradation: "mae_skill_negative_trend - mae_skill_positive_trend"
