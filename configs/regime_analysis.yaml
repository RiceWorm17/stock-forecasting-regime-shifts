scientific_purpose:
  core_question: >-
    Do learned forecasting models lose relative advantage against a simple
    zero-return persistence baseline under market-condition shifts?
  primary_focus:
    - baseline_relative_mae_skill
    - mae_skill_degradation_across_regimes
    - disagreement_between_regression_error_and_directional_accuracy
    - concentration_of_descriptive_failures_by_market_condition
  regime_role: post_prediction_evaluation_dimension_only
  causal_economic_claims: prohibited
  trading_or_profitability_claims: prohibited
  performance_based_methodology_changes: prohibited
  regime_outcomes_may_modify_models: false
  model_results_may_redefine_regimes: false

